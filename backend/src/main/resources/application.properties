spring.application.name=student-management

# Database: defaults to XAMPP / local MySQL (user: root, no password). Set DB_PASSWORD if your MySQL has a password.
spring.datasource.url=jdbc:mysql://localhost:3306/student_management?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8080

# Frontend origins allowed to call the API (comma separated)
app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500
