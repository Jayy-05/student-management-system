<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login · Student Management System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand-group">
        <a href="index.html" class="brand">🎓 Student Management</a>
      </div>
      <nav class="nav">
        <a href="index.html">Dashboard</a>
        <a href="students.html">Students</a>
        <a href="courses.html">Courses</a>
      </nav>
    </div>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Welcome Back</h1>
        <p>Sign in to manage students, attendance & exams</p>
      </div>

      <div class="auth-credentials-hint">
        <strong>Demo Administrator:</strong><br>
        Username: <code>admin</code> &bull; Password: <code>admin123</code>
      </div>

      <form id="loginForm" novalidate>
        <div style="margin-bottom: 16px;">
          <label for="username">Username *</label>
          <input id="username" name="username" value="admin" required autofocus>
          <div class="field-error" data-error="username"></div>
        </div>

        <div style="margin-bottom: 20px;">
          <label for="password">Password *</label>
          <input id="password" name="password" type="password" value="admin123" required>
          <div class="field-error" data-error="password"></div>
        </div>

        <button type="submit" class="btn btn-primary" id="loginBtn" style="width: 100%; padding: 11px;">
          Sign in
        </button>
      </form>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get("expired") === "1") {
      showToast("Session expired. Please sign in again.", "error");
    }

    const form = document.getElementById("loginForm");
    const loginBtn = document.getElementById("loginBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      document.querySelectorAll("[data-error]").forEach(el => el.textContent = "");

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!username) {
        document.querySelector('[data-error="username"]').textContent = "Username is required";
        return;
      }
      if (!password) {
        document.querySelector('[data-error="password"]').textContent = "Password is required";
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = "Signing in…";

      try {
        await AuthApi.login(username, password);
        showToast("Signed in successfully!");
        setTimeout(() => {
          window.location.href = "index.html";
        }, 500);
      } catch (err) {
        showToast(err.message, "error");
        if (err.fieldErrors) {
          Object.entries(err.fieldErrors).forEach(([field, msg]) => {
            const el = document.querySelector(`[data-error="${field}"]`);
            if (el) el.textContent = msg;
          });
        }
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = "Sign in";
      }
    });
  </script>
</body>
</html>
